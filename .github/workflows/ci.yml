name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  changes:
    name: File Detection
    if: github.event.pull_request.draft != true && (github.event_name == 'workflow_dispatch' || (!startsWith(github.head_ref || '', 'renovate/') && !startsWith(github.head_ref || '', 'dependabot/')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      typescript: ${{ steps.ts_changes.outputs.any_changed }}
      config: ${{ steps.config_changes.outputs.any_changed }}
      any: ${{ steps.ts_changes.outputs.any_changed == 'true' || steps.config_changes.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 2

      - name: Check TypeScript
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        id: ts_changes
        with:
          files: |
            **/*.{ts,tsx}
            **/tsconfig*.json
            package.json
            pnpm-lock.yaml

      - name: Check Config
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        id: config_changes
        with:
          files: |
            turbo.json
            biome.json
            **/next.config.*
            .github/workflows/ci.yml

  quality:
    name: Quality
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.any == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://localhost:5432/__ci_placeholder__
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Lint
        run: pnpm check

      - name: Type Check
        if: needs.changes.outputs.typescript == 'true' || needs.changes.outputs.config == 'true' || github.event_name == 'workflow_dispatch'
        run: pnpm check-types

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.any == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://localhost:5432/__ci_build_placeholder__
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Cache Next.js Build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .next/cache
            apps/web/.next/cache
            apps/docs/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**', 'apps/docs/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build
